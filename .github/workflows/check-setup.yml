name: Check recorder setup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install yt-dlp
        run: pip install -U yt-dlp
      - name: Run probe test
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: python3 test_probe.py
